user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  curator_combined  '$remote_addr - $remote_user [$time_local] '
                                  '"$request" $status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  'next_action="$http_next_action" rt=$request_time';

    access_log  /var/log/nginx/access.log  curator_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    server_tokens on;

    # Upstream to Next.js Application Container
    upstream nextjs_upstream {
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # =========================================================================
    # PORT 80: Primary Academic Curator Web Platform
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost academic-curator.internal _;

        client_max_body_size 50M;

        # Standard Enterprise Camouflage Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Powered-By "AcademicCurator-EdgeGateway/2.4" always;

        # Static caching for Next.js static bundles
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache_bypass $http_upgrade;
            expires 365d;
            access_log off;
        }

        # Next.js Server Components & Server Actions Reverse Proxy
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Next.js 15 Server Actions Critical Headers Passthrough
            proxy_set_header Next-Action $http_next_action;
            proxy_set_header Next-Router-State-Tree $http_next_router_state_tree;
            proxy_set_header Next-Url $http_next_url;
            proxy_set_header RSC $http_rsc;

            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # =========================================================================
    # PORT 8080: Curator Telemetry & Internal Actuator Gateway
    # =========================================================================
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost _;

        add_header X-Powered-By "Spring-Boot/3.2.1" always;
        add_header X-Application-Context "curator-actuator-service" always;

        # Root Whitelabel Error Page
        location = / {
            default_type text/html;
            return 404 '<html><body><h1>Whitelabel Error Page</h1><p>This application has no explicit mapping for /error, so you are seeing this as a fallback.</p><div style="color:red">There was an unexpected error (type=Not Found, status=404).</div><div>No message available</div></body></html>';
        }

        # Actuator endpoints
        location = /actuator {
            default_type application/json;
            return 200 '{"_links":{"self":{"href":"http://localhost:8080/actuator","templated":false},"health":{"href":"http://localhost:8080/actuator/health","templated":false},"info":{"href":"http://localhost:8080/actuator/info","templated":false},"env":{"href":"http://localhost:8080/actuator/env","templated":false}}}';
        }

        location = /actuator/health {
            default_type application/json;
            return 200 '{"status":"UP","components":{"db":{"status":"UP","details":{"database":"PostgreSQL","validationQuery":"isValid()"}},"diskSpace":{"status":"UP","details":{"total":107374182400,"free":53687091200,"threshold":10485760}},"flightEngine":{"status":"UP","version":"19.0.0-rc-66855b96"}}}';
        }

        location = /actuator/info {
            default_type application/json;
            return 200 '{"app":{"name":"academic-curator-mesh","version":"2.4.1-SNAPSHOT","description":"Curator Core Telemetry & Service Bus"}}';
        }

        location /actuator/env {
            default_type application/json;
            add_header WWW-Authenticate 'Basic realm="Curator Actuator Realm"' always;
            return 401 '{"timestamp":"2026-08-26T21:50:00.000+00:00","status":401,"error":"Unauthorized","message":"Full authentication is required to access this resource","path":"/actuator/env"}';
        }

        location /api/internal/ {
            default_type application/json;
            return 403 '{"timestamp":"2026-08-26T21:50:00.000+00:00","status":403,"error":"Forbidden","message":"Access Denied: Request originating IP is not whitelisted in internal cluster subnet (10.0.0.0/8).","path":"/api/internal/"}';
        }
    }
}
