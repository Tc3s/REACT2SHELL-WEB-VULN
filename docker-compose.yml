services:
  # ===========================================================================
  # 1. Reverse Proxy (Nginx) — Port 80 (Main Portal) & Port 8080 (Internal Actuator)
  # ===========================================================================
  proxy:
    image: nginx:1.24-alpine
    container_name: curator-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/error_pages:/usr/share/nginx/html:ro
    depends_on:
      - web
    networks:
      - elearning-net

  # ===========================================================================
  # 2. Main Web Application (Academic Curator Core Portal)
  # ===========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curator-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@elearning-db:5432/elearning
      - AUTH_SECRET=k8sJ3mP9xR2vL5nQ7wF0yT4uA6bD1eH
      - APP_HOST=localhost
      - AUTH_TRUST_HOST=true
      - DB_INTERNAL_HOST=elearning-db
      - DB_USER=readonly_auditor
      - DB_PASS=Learning@2026!
    depends_on:
      - postgres
    networks:
      - elearning-net

  # ===========================================================================
  # 3. Database Tier (PostgreSQL Database Engine)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: elearning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elearning
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - elearning-net

  # ===========================================================================
  # 4. Cache & Session Store (Redis Cluster Instance)
  # ===========================================================================
  redis-decoy:
    image: redis:7-alpine
    container_name: curator-redis-decoy
    restart: unless-stopped
    command: redis-server --requirepass "Curator@RedisSessionAuth2026!#"
    ports:
      - "6379:6379"
    networks:
      - elearning-net

  # ===========================================================================
  # 5. Infrastructure Network Services (Storage Archive & SSH Bastion)
  # ===========================================================================
  network-decoys:
    build:
      context: ./docker/decoys
      dockerfile: Dockerfile
    container_name: curator-net-decoys
    restart: unless-stopped
    ports:
      - "21:21"
      - "2222:2222"
    networks:
      - elearning-net

volumes:
  pgdata:

networks:
  elearning-net:
    driver: bridge
